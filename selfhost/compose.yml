# send0, self-hosted: Postgres, the send0 server and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then `docker compose up -d`. See README.md.
name: send0

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: send0
      POSTGRES_DB: send0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U send0 -d send0"]
      interval: 5s
      timeout: 5s
      retries: 20

  send0:
    image: ghcr.io/send0-dev/send0:${SEND0_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://send0:${POSTGRES_PASSWORD}@postgres:5432/send0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Inbound mail (MX). The web UI and API on 3000 stay private: Caddy reaches them on this network.
      - "25:2525"
    volumes:
      - blobs:/data
    # Long enough for in-flight SMTP sessions, HTTP requests and queue jobs to finish.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - send0

volumes:
  postgres:
  blobs:
  caddy_data:
  caddy_config:
