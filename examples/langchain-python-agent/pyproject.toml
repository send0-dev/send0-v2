[project]
name = "send0-example-langchain-python-agent"
version = "0.0.0"
description = "A LangChain agent with its own send0 inbox"
requires-python = ">=3.10"
dependencies = ["langchain>=1,<2", "langchain-anthropic>=1,<2", "langchain-send0"]

[tool.uv]
package = false

[tool.uv.sources]
langchain-send0 = { path = "../../packages/langchain-python", editable = true }
send0 = { path = "../../packages/sdk-python", editable = true }
