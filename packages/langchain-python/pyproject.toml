[project]
name = "langchain-send0"
version = "0.1.0"
description = "send0 tools for LangChain: give any agent an email inbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kunal Dholiya" }]
keywords = ["email", "inbox", "ai", "agents", "langchain", "tools", "send0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = ["send0>=0.1.0", "langchain-core>=1,<2"]

[project.urls]
Homepage = "https://send0.dev"
Documentation = "https://send0.dev/docs/integrations/langchain-python"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "mypy>=1.11"]

# Develop against the SDK in this repo; the published package depends on send0 from PyPI.
[tool.uv.sources]
send0 = { path = "../sdk-python", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_send0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
