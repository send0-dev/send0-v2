[project]
name = "send0"
version = "0.1.0"
description = "Official Python SDK for send0: email inboxes for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kunal Dholiya" }]
keywords = ["email", "inbox", "ai", "agents", "send0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://send0.dev"
Documentation = "https://send0.dev/docs"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "datamodel-code-generator>=0.30", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/send0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
