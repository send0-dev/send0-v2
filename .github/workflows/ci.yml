name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://postgres:send0@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: send0
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # The Python SDK's tests run in their own job below, with uv.
      # Two packages at a time: each boots in-memory Postgres (PGlite), which starves a 2-core runner.
      - run: pnpm exec turbo run test --filter=!@send0/sdk-python --concurrency=2
      - run: pnpm build

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run mypy src
      - run: uv run pytest -q

  selfhost:
    name: Self-host smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Builds the image from this checkout with a layer cache, as send0:smoke (the tag compose.smoke.yml
      # uses), then starts the stack with that image.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          tags: send0:smoke
          load: true
          cache-from: type=gha,scope=selfhost-smoke
          cache-to: type=gha,scope=selfhost-smoke,mode=max
      - run: node selfhost/smoke.mjs up
        env:
          SMOKE_PREBUILT: "1"
      - run: node selfhost/smoke.mjs test
      - if: failure()
        run: node selfhost/smoke.mjs logs
      - if: always()
        run: node selfhost/smoke.mjs down
